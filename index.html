      let isLoadingUdidCert = false;

      async function handleDownloadZipNoUrl() {
        const udidInput = document.getElementById('mainUdidInput') || document.getElementById('mainUdidForCode');
        const udid = udidInput ? udidInput.value.trim() : '';
        if (!udid) {
          alert('Vui lòng nhập mã UDID!');
          return;
        }

        try {
          const res = await fetch(`/api/download-cert/${encodeURIComponent(udid)}`);
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            alert('⚠️ ' + (data.error || 'Chứng chỉ chưa sẵn sàng tải về'));
            return;
          }
          const blob = await res.blob();
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `${udid}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(downloadUrl);
        } catch (err) {
          alert('Lỗi tải chứng chỉ: ' + err.message);
        }
      }

      function setP12PasswordInReact(password = '1') {
        const allInputs = document.querySelectorAll('main input');
        allInputs.forEach(inp => {
          if (inp.placeholder && inp.placeholder.toLowerCase().includes('p12')) {
            for (const k of Object.keys(inp)) {
              if (k.startsWith('__reactProps$') && typeof inp[k]?.onChange === 'function') {
                try {
                  inp[k].onChange({ target: { value: password } });
                } catch (e) {}
              }
            }
            const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value')?.set;
            if (nativeSetter) {
              nativeSetter.call(inp, password);
            } else {
              inp.value = password;
            }
            inp.dispatchEvent(new Event('input', { bubbles: true }));
            inp.dispatchEvent(new Event('change', { bubbles: true }));
          }
        });
      }

      function findReactSignButton() {
        const buttons = Array.from(document.querySelectorAll('main button'));
        return buttons.find(b => {
          if (b.id === 'btnActivateMain' || b.id === 'tabBtnActivate' || b.id === 'tabBtnUdid') return false;
          const text = (b.textContent || '').trim();
          return text.startsWith('Cài Đặt') || text.includes('Ký') || (b.className && b.className.includes('py-4') && !b.id);
        });
      }

      async function injectZipIntoReact(file) {
        let injected = false;

        // Cách 1: Kích hoạt trực tiếp qua React Fiber Props của dropzone
        const dropzone = document.querySelector('main div.border-dashed');
        if (dropzone) {
          for (const k of Object.keys(dropzone)) {
            if (k.startsWith('__reactProps$') && typeof dropzone[k]?.onDrop === 'function') {
              try {
                dropzone[k].onDrop({
                  preventDefault: () => {},
                  stopPropagation: () => {},
                  dataTransfer: { files: [file] }
                });
                injected = true;
              } catch (e) {}
              break;
            }
          }
        }

        // Cách 2: Kích hoạt trực tiếp qua React Fiber Props của file input
        const fileInput = document.getElementById('file-upload') || document.querySelector('main input[type="file"]');
        if (fileInput) {
          for (const k of Object.keys(fileInput)) {
            if (k.startsWith('__reactProps$') && typeof fileInput[k]?.onChange === 'function') {
              try {
                fileInput[k].onChange({
                  preventDefault: () => {},
                  stopPropagation: () => {},
                  target: { files: [file] }
                });
                injected = true;
              } catch (e) {}
              break;
            }
          }

          try {
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            fileInput.dispatchEvent(new Event('input', { bubbles: true }));
            fileInput.dispatchEvent(new Event('change', { bubbles: true }));
          } catch (e) {}
        }

        // Cách 3: Dispatch DragEvent drop chuẩn
        if (dropzone) {
          try {
            const dt2 = new DataTransfer();
            dt2.items.add(file);
            const dropEvt = new DragEvent('drop', { bubbles: true, cancelable: true });
            Object.defineProperty(dropEvt, 'dataTransfer', { value: dt2 });
            dropzone.dispatchEvent(dropEvt);
          } catch (e) {}
        }

        setP12PasswordInReact('1');

        // Đợi React cập nhật state và re-render
        for (let i = 0; i < 20; i++) {
          const fileIndicator = document.querySelector('main div.bg-\\[\\#0a84ff\\]\\/10') || 
                                Array.from(document.querySelectorAll('main span, main p')).find(el => el.textContent.includes('.zip'));
          if (fileIndicator) {
            injected = true;
            break;
          }
          await new Promise(r => setTimeout(r, 50));
        }

        return injected;
      }

              el.value = toUpper ? text.trim().toUpperCase() : text.trim();

          }

          alert('Vui lòng cấp quyền truy cập clipboard hoặc dán thủ công.');

      function escapeAutoBankHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatVnd(value) {
        return Number(value || 0).toLocaleString('vi-VN') + 'đ';
      }

      let autoBankCountdownTimer = null;
      function startAutoBankCountdown(expiresAt) {
        if (autoBankCountdownTimer) clearInterval(autoBankCountdownTimer);
        const expiryMs = new Date(expiresAt || (Date.now() + 10 * 60 * 1000)).getTime();
        const tick = () => {
          const el = document.getElementById('autoBankCountdown');
          if (!el) return;
          const left = Math.max(0, expiryMs - Date.now());
          const totalSec = Math.ceil(left / 1000);
          const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
          const ss = String(totalSec % 60).padStart(2, '0');
          el.textContent = `${mm}:${ss}`;
          if (left <= 0) {
            clearInterval(autoBankCountdownTimer);
            autoBankCountdownTimer = null;
            el.textContent = 'HẾT HẠN';
          }
        };
        tick();
        autoBankCountdownTimer = setInterval(tick, 1000);
      }

      function startAutoBankPolling(orderCode, udid) {
        let checks = 0;
        const run = async () => {
          checks++;
          try {
            const res = await fetch('/api/payment/status?order=' + encodeURIComponent(orderCode), { cache: 'no-store' });
            const data = await res.json();
            if (!res.ok || !data.success || !data.order) return;
            const order = data.order;
            const live = document.getElementById('autoBankLiveStatus');

            if (order.status === 'pending') {
              if (live) live.innerHTML = order.message ? `⚠️ ${escapeAutoBankHtml(order.message)}` : '⏳ Đang chờ SePay xác nhận giao dịch...';
              return;
            }
            if (order.status === 'expired') {
              if (autoBankPollTimer) clearInterval(autoBankPollTimer);
              autoBankPollTimer = null;
              if (autoBankCountdownTimer) clearInterval(autoBankCountdownTimer);
              autoBankCountdownTimer = null;
              localStorage.removeItem('vanthang_auto_bank_order');
              resetAutoBankButtons();
              if (live) {
                live.style.background = '#fff7ed';
                live.style.borderColor = '#fdba74';
                live.style.color = '#9a3412';
                live.innerHTML = '⌛ ĐƠN ĐÃ HẾT HẠN SAU 10 PHÚT. Vui lòng tạo đơn mới để thanh toán.';
              }
              const cd = document.getElementById('autoBankCountdown');
              if (cd) cd.textContent = 'HẾT HẠN';
              return;
            }
            if (order.status === 'paid_processing') {
              if (live) live.innerHTML = '✅ ĐÃ NHẬN TIỀN — đang kích hoạt MuaCert...';
              return;
            }
            if (order.status === 'activated' || order.status === 'paid') {
              if (autoBankPollTimer) clearInterval(autoBankPollTimer);
              autoBankPollTimer = null;
              if (autoBankCountdownTimer) clearInterval(autoBankCountdownTimer);
              autoBankCountdownTimer = null;
              localStorage.removeItem('vanthang_auto_bank_order');
              resetAutoBankButtons();
              if (live) live.innerHTML = '🎉 THANH TOÁN & KÍCH HOẠT THÀNH CÔNG!';
              try {
                await autoLoadCertForPostPayChoices(udid, live);
              } catch (e) {
                if (live) live.innerHTML = `✅ Đã kích hoạt UDID. Chứng chỉ có thể đang được MuaCert xử lý; hãy sang tab Tra Cứu UDID sau ít phút.<br><span style="font-weight:500;">${escapeAutoBankHtml(e.message)}</span>`;
              }
              return;
            }
            if (order.status === 'activation_failed') {
              if (autoBankPollTimer) clearInterval(autoBankPollTimer);
              autoBankPollTimer = null;
              if (autoBankCountdownTimer) clearInterval(autoBankCountdownTimer);
              autoBankCountdownTimer = null;
              resetAutoBankButtons();
              if (live) {
                live.style.background = '#fff7ed';
                live.style.borderColor = '#fed7aa';
                live.style.color = '#9a3412';
                live.innerHTML = '⚠️ ' + escapeAutoBankHtml(order.message || 'Đã nhận tiền nhưng kích hoạt chưa thành công. Vui lòng liên hệ admin.');
              }
            }
          } catch (_) {}

          if (checks >= 180 && autoBankPollTimer) {
            clearInterval(autoBankPollTimer);
            autoBankPollTimer = null;
            const live = document.getElementById('autoBankLiveStatus');
            if (live) live.innerHTML = '⌛ Chưa nhận được xác nhận. Nếu bạn đã chuyển khoản, hãy giữ mã đơn và liên hệ admin để kiểm tra.';
            resetAutoBankButtons();
          }
        };
        run();
        autoBankPollTimer = setInterval(run, 4000);
      }

          if (target.dataset.isAutoSigning === 'true') return;

          // Lấy mã UDID
          const udidInput = (currentMainTab === 'activate' ? document.getElementById('mainUdidForCode') : document.getElementById('mainUdidInput')) || document.getElementById('mainUdidInput') || document.getElementById('mainUdidForCode');
          const udid = udidInput ? udidInput.value.trim() : '';

          const hasLoadedFile = !!(document.querySelector('main div.bg-\\[\\#0a84ff\\]\\/10') || 
                                   document.querySelector('main div.border-dashed')?.innerText?.includes('.zip') ||
                                   Array.from(document.querySelectorAll('main span, main p')).some(el => el.textContent.includes('.zip')));

          if (!hasLoadedFile) {
            e.preventDefault();
            e.stopPropagation();

            if (!udid) {
              alert('Vui lòng nhập mã UDID trước khi bấm Cài Đặt!');
              if (udidInput) udidInput.focus();
              return;
            }

            target.dataset.isAutoSigning = 'true';
            const originalHtml = target.innerHTML;
            target.innerHTML = '<span>⏳ Đang tải chứng chỉ & chuẩn bị ký...</span>';
            target.disabled = true;

            const statusDiv = (currentMainTab === 'activate' ? document.getElementById('mainActivateStatus') : document.getElementById('mainUdidStatus')) || document.getElementById('mainUdidStatus');
            try {
              await autoLoadCertAndSign(udid, statusDiv);
            } catch (err) {
              if (statusDiv) {
                statusDiv.style.display = 'block';
                statusDiv.style.background = 'rgba(239, 68, 68, 0.08)';
                statusDiv.style.border = '1px solid rgba(239, 68, 68, 0.25)';
                statusDiv.style.color = '#b91c1c';
                statusDiv.innerHTML = `<div style="font-weight: 600;">❌ ${err.message}</div>`;
              }
            } finally {
              target.disabled = false;
              target.innerHTML = originalHtml;
              setTimeout(() => {
                delete target.dataset.isAutoSigning;
              }, 2500);
            }
          }
        }, true);
      }

      async function handleCheckMainUdidStatus() {
        const udidInput = document.getElementById('mainUdidInput');
        const udid = udidInput ? udidInput.value.trim() : '';
        const statusDiv = document.getElementById('mainUdidStatus');
        if (!udid) {
          alert('Vui lòng nhập mã UDID!');
          return;
        }

        statusDiv.style.display = 'block';
        statusDiv.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px; color: #0284c7;">
            <span style="display: inline-block; width: 14px; height: 14px; border: 2px solid #0284c7; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></span>
            <span>Đang tra cứu UDID trên máy chủ store cheat ios...</span>
          </div>
        `;

        try {
          const res = await fetch(`/api/cert-status/${encodeURIComponent(udid)}`);
          const data = await res.json();
          if (res.ok && data.code === 0 && data.data) {
            const info = data.data;
            const statusUpper = (info.status || 'ACTIVE').toUpperCase();
            const isProcessing = statusUpper === 'PROCESSING';
            const isRevoked = statusUpper.includes('REVOKED') || statusUpper.includes('BANNED');

            let badge = '';
            if (isRevoked) {
              badge = `<span style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #b91c1c; font-weight: 700; padding: 3px 8px; border-radius: 6px;">🔴 ĐÃ BỊ THU HỒI (${statusUpper})</span>`;
            } else if (isProcessing) {
              badge = `<span style="background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.35); color: #b45309; font-weight: 700; padding: 3px 8px; border-radius: 6px;">🟡 ĐANG XỬ LÝ (${statusUpper})</span>`;
            } else {
              badge = `<span style="background: rgba(5, 150, 105, 0.1); border: 1px solid rgba(5, 150, 105, 0.3); color: #047857; font-weight: 700; padding: 3px 8px; border-radius: 6px;">🟢 CÒN HOẠT ĐỘNG (${statusUpper})</span>`;
            }

            statusDiv.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
                <span><b>Trạng thái:</b></span>
                ${badge}
              </div>
              <div style="margin-bottom: 10px; color: #334155;"><b>📱 Dòng máy:</b> ${info.model || 'iPhone'}</div>
              ${isProcessing ? `
                <div style="background: #fefce8; border: 1px solid #fef08a; border-radius: 12px; padding: 12px; margin-top: 8px; font-size: 12px; color: #854d0e; line-height: 1.5;">
                  ⏳ <b>Thiết bị đã được kích hoạt thành công trên hệ thống!</b><br>
                  Hệ thống MuaCert đang tiến hành tạo file chứng chỉ (thường mất từ vài phút đến ít giờ). Vui lòng quay lại kiểm tra sau ít phút để nạp chứng chỉ hoặc tải file zip!
                </div>
              ` : `
                <button type="button" onclick="handleDownloadZipNoUrl()" style="width: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; font-weight: 600; padding: 11px 14px; border-radius: 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.04);">
                  📥 Tải File Chứng Chỉ (.zip)
                </button>
                <div style="font-size: 11px; color: #64748b; text-align: center; margin-top: 8px;">Mật khẩu P12 mặc định: <b style="color: #4f46e5;">1</b></div>
              `}
            `;

            if (!isProcessing && !isRevoked) {
              loadCertByUdidIntoReact(udid);
            }
          } else {
            statusDiv.innerHTML = `<div style="color: #b91c1c; font-weight: 600;">❌ ${data.message || data.error || 'Không tìm thấy chứng chỉ cho UDID này'}</div>`;
          }
        } catch (err) {
          statusDiv.innerHTML = `<div style="color: #b91c1c; font-weight: 600;">❌ Lỗi: ${err.message}</div>`;
        }
      }

      const observer = new MutationObserver(() => {
        injectUdidIntoMainCard();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    
      async function handleTelegramInstallQuery() {
        try {
          const params = new URLSearchParams(window.location.search);
          const udid = (params.get('udid') || '').trim();
          const appId = (params.get('tgapp') || '').trim().toLowerCase();
          if (!udid || !['esign','ksign','esign2'].includes(appId)) return;

          // Chờ giao diện React và các helper sẵn sàng rồi tự nạp chứng chỉ.
          await new Promise(resolve => setTimeout(resolve, 900));
          const status = document.getElementById('autoBankLiveStatus') || document.getElementById('mainUdidStatus');
          await autoLoadCertForPostPayChoices(udid, status);
          await new Promise(resolve => setTimeout(resolve, 400));
          await signPostPayApp(appId);
        } catch (err) {
          console.error('Telegram install query error:', err);
        }
      }

      function cleanupLegacyKeyText() {
        const replacements = [
          ['Bán Key & Kích Hoạt Chứng Chỉ iOS', 'Kích Hoạt Chứng Chỉ iOS'],
          ['Bán Key & Kích Hoạt Chứng Chỉ iOS Uy Tín - Hỗ Trợ ESIGN', 'Kích Hoạt Chứng Chỉ iOS Tự Động - Hỗ Trợ ESign & KSign']
        ];
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node => {
          let text = node.nodeValue || '';
          for (const [from, to] of replacements) text = text.replace(from, to);
          node.nodeValue = text;
        });
      }
      window.addEventListener('load', () => {
        cleanupLegacyKeyText();
        setTimeout(cleanupLegacyKeyText, 700);
        setTimeout(handleTelegramInstallQuery, 1100);
      });
</script>
